# Multiview Pro for OBS: English texts. This file is the source of truth:
# every key the plugin uses is here, and every other language file has only
# keys from this one. OBS shows the English value for a key a translation
# does not have.
#
# Syntax (read by OBS): Key="Value", one per line; lines starting with # are
# comments. Inside a value, \n is a line break and \" a quote. %1 and %2 are
# filled in by the plugin and must stay in every translation.

