Dialog.Appearance.Hint="Colore del bordo: il colore che separa e circonda i riquadri. Opacità delle etichette: nomi delle scene, Anteprima e Programma (50% è l'aspetto standard di OBS). Opacità dei meter: i meter audio (100% è l'aspetto standard di OBS). Meter sui riquadri delle scene: la sorgente audio più forte di ogni scena, visibili solo se nel menu della finestra è attivo \"Meter audio\". Sempre in primo piano: vale per tutte le finestre Multiview, e questa finestra resta sopra di loro."
