name: Release

# Runs when a version tag is pushed: checks the tag against buildspec.json
# and CHANGELOG.md, builds and tests Windows, macOS and Ubuntu (24.04 and
# 26.04) exactly like
# build.yml (it is called as a reusable workflow; its Ubuntu job installs
# libcurl4-openssl-dev), then publishes a GitHub release with the zipped
# plugin for each platform and SHA256SUMS.txt. Only the final job may write to
# the repository.
#
# Tags must be numeric for now: vMAJOR.MINOR.PATCH (v0.2.0). The CMake
# bootstrap passes buildspec.json "version" to project(VERSION), which takes
# numbers only, so a pre-release ("0.2.0-rc.1") cannot be built yet; such a
# tag fails the check job.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  check:
    name: Check tag, version and change log
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag matches buildspec.json
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $tag is not vMAJOR.MINOR.PATCH. Pre-release tags cannot be built yet (project(VERSION) takes numbers only)."
            exit 1
          fi
          spec="$(jq -r '.version' buildspec.json)"
          if [ "$version" != "$spec" ]; then
            echo "::error::Tag $tag does not match buildspec.json version $spec (expected tag v$spec)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG.md has a section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash .github/scripts/changelog-section.sh "$version" CHANGELOG.md > /dev/null

  build:
    name: Build
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded files
        run: find artifacts -type f -exec ls -l {} \;

      # Layouts: unzip the Windows and Linux archives into the OBS plugins
      # folder; the macOS archive holds the .plugin bundle (locale files in
      # Contents/Resources/locale), zipped with ditto by build.yml.
      # Windows has two zips with the same DLL (the build runs on OBS 33 as it
      # is): OBS 33 reads obs-multiview-pro/obs-multiview-pro.dll and
      # obs-multiview-pro/data/locale/*.ini and flags the old bin/64bit folder
      # as legacy (it stops loading in a future version); OBS 32 reads only
      # obs-multiview-pro/bin/64bit/<binary>. Linux keeps bin/64bit, which
      # OBS 33 still loads as legacy.
      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p dist stage/windows-obs32/obs-multiview-pro/bin/64bit stage/windows-obs33/obs-multiview-pro \
            stage/ubuntu/obs-multiview-pro/bin/64bit stage/windows-obs32/obs-multiview-pro/data/locale \
            stage/windows-obs33/obs-multiview-pro/data/locale stage/ubuntu/obs-multiview-pro/data/locale \
            stage/ubuntu26-obs32/obs-multiview-pro/bin/64bit stage/ubuntu26-obs32/obs-multiview-pro/data/locale \
            stage/ubuntu26-obs33/obs-multiview-pro/data/locale

          # Locale files of an artifact (rundir layout obs-multiview-pro/locale/).
          copy_locale() {
            test -f "$1/obs-multiview-pro/locale/en-US.ini" || { echo "::error::$1 has no obs-multiview-pro/locale/en-US.ini"; exit 1; }
            cp "$1"/obs-multiview-pro/locale/*.ini "$2/obs-multiview-pro/data/locale/"
          }

          win=artifacts/obs-multiview-pro-windows-x64
          test -f "$win/obs-multiview-pro.dll" || { echo "::error::Windows artifact has no obs-multiview-pro.dll"; exit 1; }
          cp "$win/obs-multiview-pro.dll" stage/windows-obs32/obs-multiview-pro/bin/64bit/
          cp "$win/obs-multiview-pro.dll" stage/windows-obs33/obs-multiview-pro/
          if [ -f "$win/obs-multiview-pro.pdb" ]; then
            cp "$win/obs-multiview-pro.pdb" stage/windows-obs32/obs-multiview-pro/bin/64bit/
            cp "$win/obs-multiview-pro.pdb" stage/windows-obs33/obs-multiview-pro/
          fi
          copy_locale "$win" stage/windows-obs32
          copy_locale "$win" stage/windows-obs33
          (cd stage/windows-obs32 && zip -r -X "../../dist/obs-multiview-pro-$VERSION-windows-x64-obs32.zip" obs-multiview-pro)
          (cd stage/windows-obs33 && zip -r -X "../../dist/obs-multiview-pro-$VERSION-windows-x64-obs33.zip" obs-multiview-pro)

          # Each Windows zip must hold exactly its own layout: a DLL in both
          # places would make OBS 33 log a "skipping legacy plugin" warning.
          unzip -Z1 "dist/obs-multiview-pro-$VERSION-windows-x64-obs32.zip" | grep -qx 'obs-multiview-pro/bin/64bit/obs-multiview-pro.dll' \
            || { echo "::error::the obs32 zip lacks bin/64bit/obs-multiview-pro.dll"; exit 1; }
          unzip -Z1 "dist/obs-multiview-pro-$VERSION-windows-x64-obs33.zip" | grep -qx 'obs-multiview-pro/obs-multiview-pro.dll' \
            || { echo "::error::the obs33 zip lacks obs-multiview-pro.dll in the plugin folder"; exit 1; }
          if unzip -Z1 "dist/obs-multiview-pro-$VERSION-windows-x64-obs33.zip" | grep -q '/bin/64bit/'; then
            echo "::error::the obs33 zip must not hold the legacy bin/64bit folder"; exit 1
          fi

          mac=artifacts/obs-multiview-pro-macos-universal/obs-multiview-pro.plugin.zip
          test -f "$mac" || { echo "::error::macOS artifact has no obs-multiview-pro.plugin.zip"; exit 1; }
          cp "$mac" "dist/obs-multiview-pro-$VERSION-macos-universal.zip"

          lin_dir=artifacts/obs-multiview-pro-ubuntu-24.04-x86_64
          lin="$lin_dir/obs-multiview-pro.so"
          test -f "$lin" || { echo "::error::Ubuntu artifact has no obs-multiview-pro.so"; exit 1; }
          cp "$lin" stage/ubuntu/obs-multiview-pro/bin/64bit/
          copy_locale "$lin_dir" stage/ubuntu
          (cd stage/ubuntu && zip -r -X "../../dist/obs-multiview-pro-$VERSION-ubuntu-24.04-x86_64.zip" obs-multiview-pro)

          # Ubuntu 26.04 (Qt >= 6.10, Wayland compiled in): same .so in two
          # layouts, like Windows. OBS 33 reads obs-multiview-pro/obs-multiview-pro.so
          # under $XDG_DATA_HOME/obs-studio/plugins; OBS 32 reads
          # obs-multiview-pro/bin/64bit/ under ~/.config/obs-studio/plugins.
          lin26_dir=artifacts/obs-multiview-pro-ubuntu-26.04-x86_64
          lin26="$lin26_dir/obs-multiview-pro.so"
          test -f "$lin26" || { echo "::error::Ubuntu 26.04 artifact has no obs-multiview-pro.so"; exit 1; }
          cp "$lin26" stage/ubuntu26-obs32/obs-multiview-pro/bin/64bit/
          cp "$lin26" stage/ubuntu26-obs33/obs-multiview-pro/
          copy_locale "$lin26_dir" stage/ubuntu26-obs32
          copy_locale "$lin26_dir" stage/ubuntu26-obs33
          (cd stage/ubuntu26-obs32 && zip -r -X "../../dist/obs-multiview-pro-$VERSION-ubuntu-26.04-x86_64-obs32.zip" obs-multiview-pro)
          (cd stage/ubuntu26-obs33 && zip -r -X "../../dist/obs-multiview-pro-$VERSION-ubuntu-26.04-x86_64-obs33.zip" obs-multiview-pro)
          unzip -Z1 "dist/obs-multiview-pro-$VERSION-ubuntu-26.04-x86_64-obs32.zip" | grep -qx 'obs-multiview-pro/bin/64bit/obs-multiview-pro.so' \
            || { echo "::error::the Ubuntu 26.04 obs32 zip lacks bin/64bit/obs-multiview-pro.so"; exit 1; }
          unzip -Z1 "dist/obs-multiview-pro-$VERSION-ubuntu-26.04-x86_64-obs33.zip" | grep -qx 'obs-multiview-pro/obs-multiview-pro.so' \
            || { echo "::error::the Ubuntu 26.04 obs33 zip lacks obs-multiview-pro.so in the plugin folder"; exit 1; }
          if unzip -Z1 "dist/obs-multiview-pro-$VERSION-ubuntu-26.04-x86_64-obs33.zip" | grep -q '/bin/64bit/'; then
            echo "::error::the Ubuntu 26.04 obs33 zip must not hold the legacy bin/64bit folder"; exit 1
          fi

          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          ls -l dist
          cat dist/SHA256SUMS.txt
          for z in dist/*.zip; do echo "== $z"; unzip -l "$z"; done

      - name: Release notes from CHANGELOG.md
        run: bash .github/scripts/changelog-section.sh "$VERSION" CHANGELOG.md > release-notes.md

      # Draft first, assets uploaded and checked, then published: a run that
      # fails half way leaves a draft (never offered by the update check) that
      # the next run reuses; an already published release is never touched.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash .github/scripts/publish-release.sh "$GITHUB_REF_NAME" \
            "Multiview Pro for OBS $VERSION" release-notes.md \
            dist/*.zip dist/SHA256SUMS.txt
