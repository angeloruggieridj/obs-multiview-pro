name: Build

# Compile + unit tests on the three platforms, upload the built plugin.
# No signing, no notarization, no installers, no secrets. Also called by
# release.yml (workflow_call) for version tags: tag pushes do not start this
# workflow on their own, so a release builds once.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIG: RelWithDebInfo

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The windows-x64 preset names "Visual Studio 18 2026" (the local dev
      # generator); the windows-2022 runner has VS 2022, so generator and
      # platform are overridden on the command line. Everything else (OBS
      # 32.1.x sources + obs-deps + Qt6 download from buildspec.json, -Werror)
      # comes from the windows-ci-x64 preset.
      - name: Configure
        run: cmake --preset windows-ci-x64 -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build --preset windows-ci-x64 --parallel

      - name: Test
        run: ctest --test-dir build_x64 --output-on-failure -C $env:BUILD_CONFIG

      # The rundir holds the plugin and, next to it, obs-multiview-pro/locale/
      # (data/ copied by the template's target_install_resources).
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: obs-multiview-pro-windows-x64
          path: |
            build_x64/rundir/RelWithDebInfo/*.dll
            build_x64/rundir/RelWithDebInfo/*.pdb
            build_x64/rundir/RelWithDebInfo/obs-multiview-pro/locale/*.ini
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    env:
      # Ad-hoc identity: the Xcode project is never really signed in phase 1.
      CODESIGN_IDENT: "-"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          cmake --version

      - name: Configure
        run: cmake --preset macos-ci

      - name: Build
        run: cmake --build --preset macos-ci --parallel

      - name: Test
        run: ctest --test-dir build_macos --output-on-failure -C "$BUILD_CONFIG"

      # The bundle is zipped with ditto so that symlinks and permissions
      # survive the artifact upload.
      - name: Package plugin bundle
        run: |
          mkdir -p dist
          for bundle in build_macos/rundir/RelWithDebInfo/*.plugin; do
            # The locale files travel inside the bundle (Contents/Resources).
            test -f "$bundle/Contents/Resources/locale/en-US.ini" || { echo "::error::$bundle has no Contents/Resources/locale/en-US.ini"; exit 1; }
            ditto -c -k --keepParent "$bundle" "dist/$(basename "$bundle").zip"
          done
          ls -l dist

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: obs-multiview-pro-macos-universal
          path: dist/*.zip
          if-no-files-found: error

  ubuntu:
    name: Ubuntu 24.04 x86_64
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same packages as obs-plugintemplate's Ubuntu setup: libobs and the
      # frontend API come from the OBS Studio PPA, Qt6 from Ubuntu itself.
      # libcurl (update check) is the one OBS itself depends on (libcurl4).
      - name: Install build dependencies
        run: |
          sudo add-apt-repository --yes ppa:obsproject/obs-studio
          # Launchpad is sometimes unavailable (HTTP 503) and apt then silently
          # falls back to Ubuntu's own, older obs-studio, which has no libobs
          # development files. Retry, and refuse to build against anything but
          # the OBS Studio PPA package.
          ppa_ready() { [[ "$(apt-cache policy obs-studio | awk '/Candidate:/ {print $2}')" == *obsproject* ]]; }
          for attempt in 1 2 3 4 5 6; do
            sudo apt-get update || true
            ppa_ready && break
            echo "OBS Studio PPA index not available (attempt $attempt of 6), retrying in 30 s"
            sleep 30
          done
          ppa_ready || { echo "::error::The OBS Studio PPA is not available: not building against another libobs."; exit 1; }
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache \
            libgles2-mesa-dev libsimde-dev obs-studio \
            qt6-base-dev libqt6svg6-dev qt6-base-private-dev \
            libcurl4-openssl-dev

      - name: Configure
        run: cmake --preset ubuntu-ci-x86_64

      - name: Build
        run: cmake --build --preset ubuntu-ci-x86_64 --parallel

      - name: Test
        run: ctest --test-dir build_x86_64 --output-on-failure -C "$BUILD_CONFIG"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: obs-multiview-pro-ubuntu-24.04-x86_64
          path: |
            build_x86_64/rundir/RelWithDebInfo/*.so
            build_x86_64/rundir/RelWithDebInfo/obs-multiview-pro/locale/*.ini
          if-no-files-found: error

  # OBS 33 dropped Ubuntu 24.04: its Linux builds and the PPA target 26.04,
  # which has Qt >= 6.10, so the Wayland branch of multiview_window.cpp (Qt >=
  # 6.9) is compiled in here. Compiles and tests only, and is allowed to fail
  # while the 26.04 package names and the PPA's libobs are unverified; the
  # release does not use this artifact yet. The libobs it builds against is
  # whatever the PPA offers for 26.04: a plugin built against libobs 33 is
  # rejected by OBS 32 (modules compiled with a newer libobs are refused).
  ubuntu-26:
    name: Ubuntu 26.04 x86_64 (OBS 33, not blocking)
    runs-on: ubuntu-26.04
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo add-apt-repository --yes ppa:obsproject/obs-studio
          ppa_ready() { [[ "$(apt-cache policy obs-studio | awk '/Candidate:/ {print $2}')" == *obsproject* ]]; }
          for attempt in 1 2 3 4 5 6; do
            sudo apt-get update || true
            ppa_ready && break
            echo "OBS Studio PPA index not available (attempt $attempt of 6), retrying in 30 s"
            sleep 30
          done
          ppa_ready || { echo "::error::The OBS Studio PPA is not available: not building against another libobs."; exit 1; }
          apt-cache policy obs-studio | sed -n '1,4p'
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache \
            libsimde-dev obs-studio \
            qt6-base-dev libqt6svg6-dev qt6-base-private-dev \
            libcurl4-openssl-dev
          # The OpenGL ES headers moved between Ubuntu releases.
          sudo apt-get install -y --no-install-recommends libgles2-mesa-dev || sudo apt-get install -y --no-install-recommends libgles-dev
          qmake6 -query QT_VERSION || true

      - name: Configure
        run: cmake --preset ubuntu-ci-x86_64

      - name: Build
        run: cmake --build --preset ubuntu-ci-x86_64 --parallel

      - name: Test
        run: ctest --test-dir build_x86_64 --output-on-failure -C "$BUILD_CONFIG"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: obs-multiview-pro-ubuntu-26.04-x86_64
          path: |
            build_x86_64/rundir/RelWithDebInfo/*.so
            build_x86_64/rundir/RelWithDebInfo/obs-multiview-pro/locale/*.ini
          if-no-files-found: error
